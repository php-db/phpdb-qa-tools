name: "Continuous Integration"

on:
  workflow_call:
    inputs:
      php-versions:
        description: "JSON array of PHP versions to run the matrix against."
        type: string
        required: false
        default: '["8.2", "8.3", "8.4", "8.5"]'
      run-integration:
        description: "Run the integration test suite in addition to the unit suite."
        type: boolean
        required: false
        default: false
      composer-options:
        description: "Extra flags passed to composer install."
        type: string
        required: false
        default: ""
      db-image:
        description: "Container image for the DB service (e.g. mysql:8.0). Empty = no DB."
        type: string
        required: false
        default: ""
      db-env-json:
        description: "JSON object of DB container env vars."
        type: string
        required: false
        default: "{}"
      db-port:
        description: "Port to expose/map for the DB container."
        type: string
        required: false
        default: ""
      db-health-cmd:
        description: "Command run via docker exec to check DB readiness."
        type: string
        required: false
        default: ""
      db-health-retries:
        description: "Max DB health-check attempts. Raise for slow-starting engines (Oracle, MSSQL)."
        type: number
        required: false
        default: 30
      db-health-interval-seconds:
        description: "Seconds to sleep between DB health-check attempts."
        type: number
        required: false
        default: 2
      enable-codecov:
        description: "Turn on the codecov job."
        type: boolean
        required: false
        default: false
      enable-infection:
        description: "Turn on the mutation-test job."
        type: boolean
        required: false
        default: false
      coverage-php-version:
        description: "Which php-versions entry is canonical for coverage/mutation testing."
        type: string
        required: false
        default: ""
      min-msi:
        description: "Minimum Mutation Score Indicator (%) required to pass the mutation-test job."
        type: string
        required: false
        default: "10"
      min-covered-msi:
        description: "Minimum covered-code MSI (%) required to pass the mutation-test job."
        type: string
        required: false
        default: "10"
      mago-version:
        description: "Mago release installed for the format, lint, analyze, guard and mutation-test jobs. Keep in step with the version in mago.toml."
        type: string
        required: false
        default: "1.61.0"
      test-env-json:
        description: "JSON object of extra env vars exported before running tests (e.g. to override a phpunit.xml.dist connection setting for CI, since PHPUnit's <env> won't override an already-set real env var)."
        type: string
        required: false
        default: "{}"
    secrets:
      CODECOV_TOKEN:
        required: false
      INFECTION_DASHBOARD_API_KEY:
        required: false

# A called workflow can only reduce what the caller grants, so this is a ceiling.
# Every job here reads the checkout and nothing else.
permissions:
  contents: read

jobs:
  mago:
    name: "Mago (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up PHP and Mago
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: mago:${{ inputs.mago-version }}

      - name: Install dependencies
        env:
          COMPOSER_OPTIONS: ${{ inputs.composer-options }}
        # Unquoted on purpose: the value is a flag list and must be word-split.
        # Expansion is not re-parsed, so metacharacters in the value stay literal.
        run: composer install --no-interaction --no-progress $COMPOSER_OPTIONS

      # Overrides php-version from the consumer's mago.toml for each matrix leg
      # without mutating the committed config file.
      - name: Pin Mago PHP version
        env:
          MATRIX_PHP: ${{ matrix.php }}
        run: echo "MAGO_PHP_VERSION=$MATRIX_PHP" >> "$GITHUB_ENV"

      - name: Check formatting
        run: mago format --check

      - name: Lint
        if: success() || failure()
        run: mago lint

      - name: Analyze
        if: success() || failure()
        run: mago analyze

      - name: Guard
        if: success() || failure()
        run: mago guard

  test:
    name: "Test (PHP ${{ matrix.php }} | ${{ matrix.dependencies }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        dependencies: ["lowest", "locked", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ (matrix.php == inputs.coverage-php-version && matrix.dependencies == 'locked') && 'pcov' || 'none' }}

      # DB service is a manual step, not a native `services:` block, because
      # `services:` can't be conditionally omitted per input, and driver
      # packages need different engines (mysql, postgres, mariadb, oracle,
      # mssql, ...). Repos with no DB simply omit `db-image` (default ""),
      # so both steps below are skipped at zero cost.
      - name: Start DB service
        if: inputs.db-image != ''
        env:
          DB_PORT: ${{ inputs.db-port }}
          DB_IMAGE: ${{ inputs.db-image }}
          DB_ENV_JSON: ${{ inputs.db-env-json }}
        run: |
          docker run -d --name db \
            -p "${DB_PORT}:${DB_PORT}" \
            $(printf '%s' "$DB_ENV_JSON" | jq -r 'to_entries[] | "-e \(.key)=\(.value)"' | tr '\n' ' ') \
            "$DB_IMAGE"

      - name: Wait for DB to be healthy
        if: inputs.db-image != ''
        env:
          DB_HEALTH_RETRIES: ${{ inputs.db-health-retries }}
          DB_HEALTH_INTERVAL_SECONDS: ${{ inputs.db-health-interval-seconds }}
          DB_HEALTH_CMD: ${{ inputs.db-health-cmd }}
        # DB_HEALTH_CMD stays unquoted: it is a command plus arguments and must
        # be word-split. Expansion is not re-parsed, so metacharacters stay literal.
        run: |
          for i in $(seq 1 "$DB_HEALTH_RETRIES"); do
            docker exec db $DB_HEALTH_CMD && exit 0
            sleep "$DB_HEALTH_INTERVAL_SECONDS"
          done
          echo "DB did not become healthy in time" && exit 1

      # Resolve dependencies at the configured strategy level.
      # "locked" uses the committed composer.lock as-is.
      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        env:
          COMPOSER_OPTIONS: ${{ inputs.composer-options }}
        run: composer update --prefer-lowest --no-interaction --no-progress $COMPOSER_OPTIONS

      - name: Install dependencies (locked)
        if: matrix.dependencies == 'locked'
        env:
          COMPOSER_OPTIONS: ${{ inputs.composer-options }}
        run: composer install --no-interaction --no-progress $COMPOSER_OPTIONS

      - name: Install dependencies (latest)
        if: matrix.dependencies == 'latest'
        env:
          COMPOSER_OPTIONS: ${{ inputs.composer-options }}
        run: composer update --no-interaction --no-progress $COMPOSER_OPTIONS

      # PHPUnit's <env> in phpunit.xml.dist won't override an already-set real
      # env var (no force="true"), so this lets a caller override a connection
      # setting for CI (e.g. DB hostname) without touching that file, which may
      # need a different value for local dev (e.g. Docker Compose networking).
      - name: Export test environment overrides
        if: inputs.test-env-json != '{}'
        env:
          TEST_ENV_JSON: ${{ inputs.test-env-json }}
        run: printf '%s' "$TEST_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Unit tests
        if: ${{ !(matrix.php == inputs.coverage-php-version && matrix.dependencies == 'locked') }}
        run: composer test

      - name: Unit tests with coverage
        if: matrix.php == inputs.coverage-php-version && matrix.dependencies == 'locked'
        run: composer test-coverage

      - name: Integration tests
        if: inputs.run-integration
        run: composer test-integration

      - name: Upload coverage artifact
        if: matrix.php == inputs.coverage-php-version && matrix.dependencies == 'locked'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-clover
          path: clover.xml

  codecov:
    name: "Codecov"
    needs: [test]
    if: inputs.enable-codecov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-clover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # CODECOV_TOKEN is an org-wide upload token, which can't infer the
          # target repo the way a repo-specific token can. `github.repository`
          # resolves to the *calling* repo here, not phpdb-qa-tools.
          slug: ${{ github.repository }}
          files: clover.xml
          # Report-only for now across all consuming repos (legacy codebases
          # being migrated) - don't fail CI on upload/coverage issues yet.
          fail_ci_if_error: false

  mutation-test:
    name: "Mutation testing"
    needs: [test]
    if: inputs.enable-infection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up PHP and Mago
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ inputs.coverage-php-version }}
          coverage: pcov
          tools: mago:${{ inputs.mago-version }}

      - name: Start DB service
        if: inputs.db-image != '' && inputs.run-integration
        env:
          DB_PORT: ${{ inputs.db-port }}
          DB_IMAGE: ${{ inputs.db-image }}
          DB_ENV_JSON: ${{ inputs.db-env-json }}
        run: |
          docker run -d --name db \
            -p "${DB_PORT}:${DB_PORT}" \
            $(printf '%s' "$DB_ENV_JSON" | jq -r 'to_entries[] | "-e \(.key)=\(.value)"' | tr '\n' ' ') \
            "$DB_IMAGE"

      - name: Wait for DB to be healthy
        if: inputs.db-image != '' && inputs.run-integration
        env:
          DB_HEALTH_RETRIES: ${{ inputs.db-health-retries }}
          DB_HEALTH_INTERVAL_SECONDS: ${{ inputs.db-health-interval-seconds }}
          DB_HEALTH_CMD: ${{ inputs.db-health-cmd }}
        # DB_HEALTH_CMD stays unquoted: it is a command plus arguments and must
        # be word-split. Expansion is not re-parsed, so metacharacters stay literal.
        run: |
          for i in $(seq 1 "$DB_HEALTH_RETRIES"); do
            docker exec db $DB_HEALTH_CMD && exit 0
            sleep "$DB_HEALTH_INTERVAL_SECONDS"
          done
          echo "DB did not become healthy in time" && exit 1

      - name: Install dependencies
        env:
          COMPOSER_OPTIONS: ${{ inputs.composer-options }}
        # Unquoted on purpose: the value is a flag list and must be word-split.
        # Expansion is not re-parsed, so metacharacters in the value stay literal.
        run: composer install --no-interaction --no-progress $COMPOSER_OPTIONS

      - name: Export test environment overrides
        if: inputs.test-env-json != '{}'
        env:
          TEST_ENV_JSON: ${{ inputs.test-env-json }}
        run: printf '%s' "$TEST_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Pin Mago PHP version
        env:
          COVERAGE_PHP: ${{ inputs.coverage-php-version }}
        run: echo "MAGO_PHP_VERSION=$COVERAGE_PHP" >> "$GITHUB_ENV"

      # Mago is invoked internally by Infection itself (staticAnalysisTool config
      # in infection.json5), not by this workflow directly - no needs:[mago] here.
      - name: Mutation testing
        env:
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}
          MIN_MSI: ${{ inputs.min-msi }}
          MIN_COVERED_MSI: ${{ inputs.min-covered-msi }}
        run: composer mutation-test -- --min-msi="$MIN_MSI" --min-covered-msi="$MIN_COVERED_MSI" --logger-github
